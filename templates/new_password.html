{% extends 'base.html' %}
{% block content %}

<style>
    .auth-container { max-width: 450px; margin: 80px auto; padding: 50px 40px; background: white; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); border: 1px solid #f0f0f0; text-align: center; }
    .auth-title { font-size: 24px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; letter-spacing: 1px; }
    .form-group { margin-bottom: 20px; text-align: left; position: relative; }
    .form-control { 
        width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 20px; 
        outline: none; padding-right: 45px; 
    }
    .form-control:focus { border-color: black; }
    
    /* ✅ EYE ICON STYLE */
    .toggle-password {
        position: absolute;
        top: 15px; /* Centered vertically relative to input */
        right: 15px;
        cursor: pointer;
        color: #888;
        font-size: 16px;
    }
    .toggle-password:hover { color: black; }

    .auth-btn { width: 100%; padding: 15px; background: black; color: white; font-weight: bold; border: none; border-radius: 50px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    .auth-btn:hover { background: #333; transform: translateY(-2px); }
</style>

<div class="auth-container">
    <h2 class="auth-title">Reset Password</h2>
    <p style="color:#666; margin-bottom:30px; font-size:14px;">Create a strong new password.</p>
    
    <form method="POST">
        <div class="form-group">
            <input type="password" name="password" id="newPass" class="form-control" placeholder="New Password" required>
            <i class="fas fa-eye toggle-password" onclick="togglePassword('newPass', this)"></i>
        </div>
        <button type="submit" class="auth-btn">UPDATE PASSWORD</button>
    </form>
</div>

<script>
    function togglePassword(inputId, icon) {
        const input = document.getElementById(inputId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>

{% endblock %}
