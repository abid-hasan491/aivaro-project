{% extends 'base.html' %}
{% block content %}

<style>
    /* ============================ */
    /* 🔐 RESET PASSWORD PAGE STYLES */
    /* ============================ */
    .auth-wrapper { 
        min-height: 75vh; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        padding: 40px 4vw; 
    }
    
    .auth-card { 
        background: rgba(15,15,15,0.4); 
        backdrop-filter: blur(16px); 
        -webkit-backdrop-filter: blur(16px); 
        border: 1px solid rgba(255,255,255,0.08); 
        border-radius: 24px; 
        padding: 50px 40px; 
        width: 100%; 
        max-width: 480px; 
        box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        animation: fadeUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    body.light-theme .auth-card { 
        background: rgba(255,255,255,0.6); 
        border-color: rgba(0,0,0,0.05); 
        box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    @keyframes fadeUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .auth-logo { 
        text-align: center; 
        font-family: var(--font-head); 
        font-size: 36px; 
        color: var(--text-color); 
        margin-bottom: 5px; 
        letter-spacing: 2px;
    }
    
    .auth-subtitle { 
        text-align: center; 
        font-size: 11px; 
        color: var(--accent-color); 
        text-transform: uppercase; 
        letter-spacing: 2px; 
        font-weight: 800; 
        margin-bottom: 40px; 
    }

    .form-group { margin-bottom: 25px; position: relative; }
    
    .form-label { 
        display: block; 
        font-size: 10px; 
        font-weight: 800; 
        color: var(--muted-color); 
        text-transform: uppercase; 
        letter-spacing: 1.5px; 
        margin-bottom: 10px; 
    }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    
    .form-control { 
        width: 100%; 
        background: rgba(0,0,0,0.2); 
        border: 1px solid rgba(255,255,255,0.08); 
        color: var(--text-color); 
        padding: 16px 45px 16px 18px; 
        border-radius: 8px; 
        font-size: 14px; 
        font-family: var(--font-body); 
        outline: none; 
        transition: 0.3s; 
    }
    .form-control:focus { border-color: var(--accent-color); background: rgba(0,0,0,0.4); }
    
    body.light-theme .form-control { background: rgba(255,255,255,0.4); color: #000; border-color: rgba(0,0,0,0.1); }
    body.light-theme .form-control:focus { background: #fff; border-color: var(--accent-color); }

    .toggle-pwd { 
        position: absolute; 
        right: 18px; 
        color: var(--muted-color); 
        cursor: pointer; 
        transition: 0.3s; 
        font-size: 16px; 
    }
    .toggle-pwd:hover { color: var(--accent-color); }

    /* 🔥 DYNAMIC PASSWORD STRENGTH INDICATOR */
    .strength-meter { 
        margin-top: 12px; 
        display: flex; 
        gap: 6px; 
        height: 5px; 
        border-radius: 3px; 
        overflow: hidden; 
    }
    
    .strength-bar { 
        flex: 1; 
        background: rgba(255,255,255,0.1); 
        transition: 0.4s ease; 
        border-radius: 3px; 
    }
    body.light-theme .strength-bar { background: rgba(0,0,0,0.1); }
    
    .strength-text { 
        font-size: 10px; 
        font-weight: 800; 
        margin-top: 8px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        text-transform: uppercase; 
        letter-spacing: 1px; 
        transition: 0.3s;
    }
    
    /* Indicator Colors & Glow Effects */
    .weak .bar-1 { background: #ff4d4d; box-shadow: 0 0 10px rgba(255,77,77,0.6); }
    .fair .bar-1, .fair .bar-2 { background: #f1c40f; box-shadow: 0 0 10px rgba(241,196,15,0.6); }
    .good .bar-1, .good .bar-2, .good .bar-3 { background: #3498db; box-shadow: 0 0 10px rgba(52,152,219,0.6); }
    .strong .bar-1, .strong .bar-2, .strong .bar-3, .strong .bar-4 { background: #2ecc71; box-shadow: 0 0 10px rgba(46,204,113,0.6); }

    .btn-submit { 
        width: 100%; 
        background: var(--accent-color); 
        color: #000; 
        border: none; 
        padding: 18px; 
        border-radius: 30px; 
        font-weight: 800; 
        font-size: 12px; 
        text-transform: uppercase; 
        letter-spacing: 2px; 
        cursor: pointer; 
        transition: 0.4s; 
        margin-top: 15px; 
        box-shadow: 0 10px 25px rgba(198,167,94,0.3); 
    }
    .btn-submit:hover { 
        background: #FFF; 
        transform: translateY(-3px); 
        box-shadow: 0 15px 35px rgba(198,167,94,0.5); 
    }

    /* 📱 MOBILE RESPONSIVE */
    @media (max-width: 600px) {
        .auth-card { padding: 40px 25px; border-radius: 20px; }
        .auth-logo { font-size: 30px; }
        .form-control { padding: 15px 40px 15px 15px; font-size: 13px; }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card liquid-glass">
        <div class="auth-logo">AIVARO</div>
        <div class="auth-subtitle">Create New Password</div>
        
        <form action="/reset-password" method="POST">
            <div class="form-group">
                <label class="form-label">New Password</label>
                <div class="input-wrapper">
                    <input type="password" name="password" id="newPwd" class="form-control" placeholder="Enter new password" required>
                    <i class="far fa-eye toggle-pwd" onclick="togglePasswordVisibility('newPwd', this)"></i>
                </div>
                
                <!-- 🔥 Interactive Strength Indicator -->
                <div class="strength-meter" id="strengthMeter">
                    <div class="strength-bar bar-1"></div>
                    <div class="strength-bar bar-2"></div>
                    <div class="strength-bar bar-3"></div>
                    <div class="strength-bar bar-4"></div>
                </div>
                <div class="strength-text">
                    <span style="color: var(--muted-color);">Strength:</span>
                    <span id="strengthLabel" style="color: var(--muted-color);">None</span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <input type="password" name="confirm_password" id="confPwd" class="form-control" placeholder="Confirm new password" required>
                    <i class="far fa-eye toggle-pwd" onclick="togglePasswordVisibility('confPwd', this)"></i>
                </div>
                <!-- 🔥 Live Match Indicator -->
                <div id="matchText" style="font-size: 10px; font-weight: 800; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; display: none; text-align: right;"></div>
            </div>

            <button type="submit" class="btn-submit">Save Password</button>
        </form>
    </div>
</div>

<script>
    // Toggle Eye Icon for Show/Hide Password
    function togglePasswordVisibility(inputId, icon) {
        const inp = document.getElementById(inputId);
        if (inp.type === 'password') {
            inp.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            inp.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    const pwdInput = document.getElementById('newPwd');
    const confInput = document.getElementById('confPwd');
    const meter = document.getElementById('strengthMeter');
    const label = document.getElementById('strengthLabel');
    const matchText = document.getElementById('matchText');

    // Calculate and Animate Password Strength
    pwdInput.addEventListener('input', function() {
        const val = pwdInput.value;
        meter.className = 'strength-meter'; // Reset classes
        
        if (val.length === 0) {
            label.innerText = 'None';
            label.style.color = 'var(--muted-color)';
            checkMatch();
            return;
        }

        let strengthScore = 0;
        
        // Simple scoring logic
        if (val.length >= 4) strengthScore += 1;
        if (val.length >= 8) strengthScore += 1;
        if (/[A-Z]/.test(val) && /[a-z]/.test(val)) strengthScore += 1; // Mixed case
        if (/[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val)) strengthScore += 1; // Number & Special Char

        // Apply colors based on score
        if (strengthScore <= 1) {
            meter.classList.add('weak');
            label.innerText = 'Weak';
            label.style.color = '#ff4d4d';
        } else if (strengthScore === 2) {
            meter.classList.add('fair');
            label.innerText = 'Fair';
            label.style.color = '#f1c40f';
        } else if (strengthScore === 3) {
            meter.classList.add('good');
            label.innerText = 'Good';
            label.style.color = '#3498db';
        } else {
            meter.classList.add('strong');
            label.innerText = 'Strong';
            label.style.color = '#2ecc71';
        }
        
        checkMatch();
    });

    // Check if Confirm Password matches
    confInput.addEventListener('input', checkMatch);

    function checkMatch() {
        const val1 = pwdInput.value;
        const val2 = confInput.value;
        
        if (val2.length > 0) {
            matchText.style.display = 'block';
            if (val1 === val2) {
                matchText.innerText = 'Passwords Match';
                matchText.style.color = '#2ecc71';
            } else {
                matchText.innerText = 'Passwords Do Not Match';
                matchText.style.color = '#ff4d4d';
            }
        } else {
            matchText.style.display = 'none';
        }
    }
</script>

{% endblock %}
