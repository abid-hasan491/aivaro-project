{% extends 'base.html' %}

{% block content %}
<div style="padding: 40px 5%; max-width: 600px; margin: 0 auto; min-height: 70vh; display: flex; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); width: 100%; border: 1px solid #eee;">
        
        <h2 style="text-align: center; margin-bottom: 20px; font-weight: bold;">WRITE A REVIEW</h2>
        <p style="text-align: center; color: #777; margin-bottom: 30px;">Reviewing: <strong>{{ product.name }}</strong></p>

        <form action="/submit-review/{{ order.id }}/{{ product.id }}" method="POST" enctype="multipart/form-data">
            
            <div style="text-align: center; margin-bottom: 25px;">
                <label style="font-weight: bold; display: block; margin-bottom: 10px;">YOUR RATING</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required /><label for="star5" title="5 stars"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star4" name="rating" value="4" /><label for="star4" title="4 stars"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star3" name="rating" value="3" /><label for="star3" title="3 stars"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star2" name="rating" value="2" /><label for="star2" title="2 stars"><i class="fas fa-star"></i></label>
                    <input type="radio" id="star1" name="rating" value="1" /><label for="star1" title="1 star"><i class="fas fa-star"></i></label>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">YOUR REVIEW (Optional)</label>
                <textarea name="comment" rows="5" placeholder="What did you like or dislike? What did you use this product for?" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; resize: vertical; font-family: inherit;"></textarea>
            </div>

            <div style="margin-bottom: 25px;">
                <label style="font-weight: bold; display: block; margin-bottom: 5px;">ADD A PHOTO (Optional)</label>
                <input type="file" name="review_image" accept="image/*" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; background: #f9f9f9;">
            </div>

            <button type="submit" style="width: 100%; background: black; color: white; padding: 15px; border: none; font-weight: bold; font-size: 16px; border-radius: 5px; cursor: pointer; transition: 0.3s;">
                SUBMIT REVIEW
            </button>
        </form>
        
        <div style="text-align: center; margin-top: 20px;">
             <a href="/track-order/{{ order.id }}" style="color: #777; text-decoration: none; font-size: 14px;">Cancel</a>
        </div>
    </div>
</div>

<style>
    /* ⭐ Star Rating CSS Magic */
    .star-rating {
        display: inline-flex;
        flex-direction: row-reverse; /* Reverse order for CSS selection */
        gap: 5px;
    }
    .star-rating input { display: none; } /* Hide radio buttons */
    .star-rating label {
        font-size: 30px;
        color: #ddd;
        cursor: pointer;
        transition: 0.2s;
    }
    /* Hover & Checked effects (Reverse logic due to flex-direction) */
    .star-rating label:hover,
    .star-rating label:hover ~ label,
    .star-rating input:checked ~ label {
        color: #ffc107; /* Gold color */
    }
</style>
{% endblock %}
