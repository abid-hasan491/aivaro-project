{% extends 'base.html' %}
{% block content %}

<style>
    .admin-layout { display: flex; min-height: 100vh; background: var(--bg-color); }
    .admin-sidebar { width: 260px; background: var(--panel-color); border-right: 1px solid var(--border-color); position: fixed; height: 100vh; display: flex; flex-direction: column; padding: 30px 0; z-index: 100; }
    .admin-main { flex: 1; margin-left: 260px; padding: 40px; max-width: 1000px; }
    
    .sidebar-logo { font-family: var(--font-head); font-size: 28px; color: var(--text-color); text-align: center; margin-bottom: 50px; letter-spacing: 3px; font-weight: 600;}
    .sidebar-logo span { color: var(--accent-color); }
    .sidebar-menu { display: flex; flex-direction: column; gap: 8px; padding: 0 20px; flex: 1;}
    .sidebar-link { display: flex; align-items: center; gap: 15px; padding: 14px 20px; color: var(--muted-color); text-decoration: none; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; border-radius: 8px; transition: 0.3s; }
    .sidebar-link:hover, .sidebar-link.active { background: rgba(198,167,94,0.1); color: var(--accent-color); }
    .sidebar-link i { font-size: 18px; width: 24px; text-align: center; }
    .sidebar-bottom { padding: 0 20px; margin-top: auto; border-top: 1px solid var(--border-color); padding-top: 25px; }

    .form-container { background: rgba(15, 15, 15, 0.45); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px; padding: 40px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    body.light-theme .form-container { background: rgba(255, 255, 255, 0.6); border-color: rgba(0,0,0,0.05); }

    .f-title { font-family: var(--font-head); font-size: 26px; color: var(--accent-color); margin-bottom: 30px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 15px; }
    body.light-theme .f-title { border-bottom-color: rgba(0,0,0,0.1); }
    
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 25px; }
    .full-width { grid-column: 1 / -1; }
    
    .form-group { display: flex; flex-direction: column; gap: 8px; }
    .form-label { font-size: 10px; font-weight: 800; color: var(--muted-color); text-transform: uppercase; letter-spacing: 1.5px; }
    .form-control { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); color: var(--text-color); padding: 15px; border-radius: 8px; font-size: 13px; font-family: var(--font-body); outline: none; transition: 0.3s; }
    .form-control:focus { border-color: var(--accent-color); background: rgba(0,0,0,0.4); }
    body.light-theme .form-control { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.1); color: #000; }

    /* 🔥 SIZE CHART TABLE STYLES */
    .size-chart-wrapper { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; overflow-x: auto; }
    body.light-theme .size-chart-wrapper { background: rgba(255,255,255,0.4); border-color: rgba(0,0,0,0.05); }
    
    .size-table { width: 100%; border-collapse: collapse; min-width: 500px; text-align: center; }
    .size-table th { padding: 10px; color: var(--accent-color); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px dashed rgba(255,255,255,0.1); }
    body.light-theme .size-table th { border-bottom-color: rgba(0,0,0,0.1); }
    .size-table td { padding: 10px 5px; }
    .size-table .row-label { font-weight: 800; color: var(--text-color); font-size: 14px; }
    .size-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08); color: var(--text-color); padding: 12px; border-radius: 6px; font-size: 12px; text-align: center; width: 100%; outline: none; transition: 0.3s;}
    .size-input:focus { border-color: var(--accent-color); }
    body.light-theme .size-input { background: rgba(255,255,255,0.6); color: #000; border-color: rgba(0,0,0,0.1); }

    .btn-submit { width: 100%; background: var(--accent-color); color: #000; border: none; padding: 18px; border-radius: 30px; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.4s; margin-top: 20px; }
    .btn-submit:hover { background: #FFF; transform: translateY(-3px); box-shadow: 0 15px 35px rgba(198,167,94,0.4); }

    @media (max-width: 900px) {
        .admin-sidebar { display: none; }
        .admin-main { margin-left: 0; padding: 20px; }
        .form-grid { grid-template-columns: 1fr; }
        .form-container { padding: 25px 20px; }
    }
</style>

<div class="admin-layout">
    <aside class="admin-sidebar">
        <div class="sidebar-logo">AIV<span>A</span>RO</div>
        <nav class="sidebar-menu">
            <a href="/admin" class="sidebar-link {% if request.path == '/admin' or request.path == '/admin/add-product-page' %}active{% endif %}"><i class="fas fa-box"></i> Products</a>
            <a href="/admin/orders" class="sidebar-link {% if request.path == '/admin/orders' %}active{% endif %}"><i class="fas fa-shopping-bag"></i> Orders</a>
            <a href="/admin/users" class="sidebar-link {% if request.path == '/admin/users' %}active{% endif %}"><i class="fas fa-users"></i> Customers</a>
            <a href="/admin/campaigns" class="sidebar-link {% if request.path == '/admin/campaigns' %}active{% endif %}"><i class="fas fa-ticket-alt"></i> Coupons</a>
            <a href="/admin/banners" class="sidebar-link {% if request.path == '/admin/banners' %}active{% endif %}"><i class="fas fa-image"></i> Banners</a>
            <a href="/admin/feedback" class="sidebar-link {% if request.path == '/admin/feedback' %}active{% endif %}"><i class="fas fa-comment-dots"></i> Feedback</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="/" class="sidebar-link" style="color: var(--muted-color);"><i class="fas fa-store"></i> Storefront</a>
            <a href="/logout" class="sidebar-link" style="color: #ff4d4d;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
    </aside>

    <main class="admin-main">
        <div class="form-container">
            <h2 class="f-title"><i class="fas fa-plus-circle"></i> Add New Masterpiece</h2>
            
            <form action="/admin/add-product" method="POST" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="form-group full-width">
                        <label class="form-label">Product Name</label>
                        <input type="text" name="name" class="form-control" placeholder="E.g. Premium Cuban Collar Shirt" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Price (৳)</label>
                        <input type="number" name="price" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Discount (%)</label>
                        <input type="number" name="discount" class="form-control" value="0">
                    </div>
                    
                    <!-- 🔥 DYNAMIC CATEGORY & GENDER -->
                    <div class="form-group">
                        <label class="form-label">Category Name</label>
                        <input type="text" name="category" class="form-control" placeholder="E.g. T-Shirt, Jacket, Panjabi" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gender Section</label>
                        <select name="gender" class="form-control" required>
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                            <option value="Unisex">Unisex</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Stock Quantity</label>
                        <input type="number" name="stock" class="form-control" required>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">Available Sizes (Comma Separated)</label>
                        <input type="text" name="sizes" class="form-control" placeholder="E.g. M, L, XL" required>
                    </div>

                    <div class="form-group full-width" style="margin-top: 10px;">
                        <label class="form-label" style="color: var(--accent-color);"><i class="fas fa-ruler-combined"></i> Size Chart Measurements (Optional)</label>
                        <div class="size-chart-wrapper">
                            <table class="size-table">
                                <thead>
                                    <tr>
                                        <th>Size</th>
                                        <th>Chest (in)</th>
                                        <th>Length (in)</th>
                                        <th>Sleeve (in)</th>
                                        <th>Waist (Pants)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td class="row-label">M</td>
                                        <td><input type="text" name="m_chest" class="size-input" placeholder='40"'></td>
                                        <td><input type="text" name="m_len" class="size-input" placeholder='28"'></td>
                                        <td><input type="text" name="m_sleeve" class="size-input" placeholder='9"'></td>
                                        <td><input type="text" name="m_waist" class="size-input" placeholder='30"'></td>
                                    </tr>
                                    <tr>
                                        <td class="row-label">L</td>
                                        <td><input type="text" name="l_chest" class="size-input" placeholder='42"'></td>
                                        <td><input type="text" name="l_len" class="size-input" placeholder='29"'></td>
                                        <td><input type="text" name="l_sleeve" class="size-input" placeholder='9.5"'></td>
                                        <td><input type="text" name="l_waist" class="size-input" placeholder='32"'></td>
                                    </tr>
                                    <tr>
                                        <td class="row-label">XL</td>
                                        <td><input type="text" name="xl_chest" class="size-input" placeholder='44"'></td>
                                        <td><input type="text" name="xl_len" class="size-input" placeholder='30"'></td>
                                        <td><input type="text" name="xl_sleeve" class="size-input" placeholder='10"'></td>
                                        <td><input type="text" name="xl_waist" class="size-input" placeholder='34"'></td>
                                    </tr>
                                    <tr>
                                        <td class="row-label">XXL</td>
                                        <td><input type="text" name="xxl_chest" class="size-input" placeholder='46"'></td>
                                        <td><input type="text" name="xxl_len" class="size-input" placeholder='31"'></td>
                                        <td><input type="text" name="xxl_sleeve" class="size-input" placeholder='10.5"'></td>
                                        <td><input type="text" name="xxl_waist" class="size-input" placeholder='36"'></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="form-group full-width" style="margin-top: 10px;">
                        <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--accent-color); font-weight: 700; font-size: 13px;">
                            <input type="checkbox" name="is_luxury" style="width: 18px; height: 18px; accent-color: var(--accent-color);"> Mark as Luxury Showcase (Displays on Homepage)
                        </label>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="4" required></textarea>
                    </div>
                    <div class="form-group full-width">
                        <label class="form-label">Upload Images</label>
                        <input type="file" name="images" class="form-control" style="background: transparent;" multiple required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Add Product to Store</button>
            </form>
        </div>
    </main>
</div>
{% endblock %}
