{% if not messages %}
    <div style="text-align:center; color:#555; margin-top: 50px;">
        <i class="fas fa-comment-dots" style="font-size: 40px; margin-bottom: 15px; opacity: 0.5;"></i><br>
        <span style="font-size: 13px; font-weight: 500;">No messages yet.<br>Send a message to start the conversation.</span>
    </div>
{% else %}
    {% for msg in messages %}
        <div class="msg {% if msg.is_admin_reply %}admin{% else %}user{% endif %}">
            
            {% if msg.image_url %}
                <img src="{{ url_for('static', filename='chat_images/' ~ msg.image_url) }}" style="max-width: 200px; border-radius: 6px; display: block; margin-bottom: 8px; border: 1px solid #333;">
            {% endif %}
            
            {% if msg.content %}
                <span style="word-break: break-word;">{{ msg.content }}</span>
            {% endif %}
            
            <div style="font-size: 9px; margin-top: 6px; opacity: 0.6; text-align: right; letter-spacing: 0.5px;">
                {{ msg.timestamp.strftime('%I:%M %p') }}
            </div>
            
        </div>
    {% endfor %}
{% endif %}
