<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIVARO - Admin Panel</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* ============================ */
        /* 👑 ADMIN CORE STYLES         */
        /* ============================ */
        :root {
            --font-head: 'Playfair Display', serif;
            --font-main: 'Montserrat', sans-serif;
            
            --bg-dark: #050505;
            --panel-dark: #0d0d0d;
            --text-light: #F5F5F5;
            --text-muted: #888888;
            --accent-gold: #C6A75E;
            --border-color: #222222;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: var(--font-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 📱 Mobile Overlay */
        .sidebar-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); z-index: 99; backdrop-filter: blur(3px);
        }

        /* 📌 SIDEBAR */
        .sidebar {
            width: 260px;
            background: #000;
            border-right: 1px solid var(--border-color);
            position: fixed;
            top: 0; left: 0; height: 100vh;
            display: flex; flex-direction: column;
            z-index: 100;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .brand-logo {
            padding: 30px 20px; text-align: center;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }
        .brand-logo h2 {
            font-family: var(--font-head); font-size: 28px;
            color: white; letter-spacing: 3px; font-weight: 700;
        }
        .brand-logo span { color: var(--accent-gold); }

        .nav-links { flex: 1; padding: 0 15px; display: flex; flex-direction: column; gap: 8px; }
        
        .nav-item {
            display: flex; align-items: center; gap: 15px;
            padding: 14px 20px; color: var(--text-muted);
            text-decoration: none; font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            border-radius: 8px; transition: 0.3s;
        }
        .nav-item i { font-size: 16px; width: 20px; text-align: center; transition: 0.3s; }
        
        .nav-item:hover, .nav-item.active {
            background: rgba(198, 167, 94, 0.1);
            color: var(--accent-gold);
            border-left: 3px solid var(--accent-gold);
        }
        
        .sidebar-footer { padding: 20px 15px; border-top: 1px solid var(--border-color); }
        .sidebar-footer .nav-item:hover { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border-color: #ff4d4d; }

        /* 🖥️ MAIN CONTENT AREA */
        .main-content {
            flex: 1;
            margin-left: 260px; /* Offset for sidebar */
            min-height: 100vh;
            display: flex; flex-direction: column;
            transition: 0.4s;
            width: calc(100% - 260px);
        }

        /* Top Navbar */
        .top-bar {
            background: rgba(13, 13, 13, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky; top: 0; z-index: 50;
        }

        .menu-toggle {
            display: none; background: transparent; border: none;
            color: white; font-size: 24px; cursor: pointer;
        }

        .admin-profile { display: flex; align-items: center; gap: 12px; }
        .admin-avatar {
            width: 35px; height: 35px; background: var(--accent-gold);
            color: #000; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-weight: bold; font-size: 14px;
        }
        .admin-info h4 { font-size: 13px; color: white; font-weight: 600; }
        .admin-info p { font-size: 10px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }

        /* Content Wrapper */
        .content-wrapper { padding: 40px; flex: 1; }

        /* 📱 RESPONSIVE DESIGN */
        @media (max-width: 900px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .sidebar-overlay.show { display: block; }
            
            .main-content { margin-left: 0; width: 100%; }
            .top-bar { padding: 15px 20px; }
            .menu-toggle { display: block; }
            .content-wrapper { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand-logo">
            <h2>AIV<span>A</span>RO</h2>
        </div>
        
        <nav class="nav-links">
            <a href="/admin" class="nav-item {% if request.path == '/admin' or 'product' in request.path %}active{% endif %}">
                <i class="fas fa-box-open"></i> Products
            </a>
            <a href="/admin/orders" class="nav-item {% if 'orders' in request.path %}active{% endif %}">
                <i class="fas fa-shopping-bag"></i> Orders
            </a>
            <a href="/admin/users" class="nav-item {% if 'users' in request.path %}active{% endif %}">
                <i class="fas fa-users"></i> Customers
            </a>
            <a href="/admin/campaigns" class="nav-item {% if 'campaigns' in request.path %}active{% endif %}">
                <i class="fas fa-ticket-alt"></i> Coupons
            </a>
            <a href="/admin/banners" class="nav-item {% if 'banners' in request.path %}active{% endif %}">
                <i class="fas fa-images"></i> Banners
            </a>
        </nav>

        <div class="sidebar-footer">
            <a href="/" class="nav-item" style="color: #bbb;">
                <i class="fas fa-store"></i> Storefront
            </a>
            <a href="/logout" class="nav-item" style="color: #ff4d4d; margin-top: 10px;">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <button class="menu-toggle" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            
            <div style="flex: 1;"></div> <div class="admin-profile">
                <div class="admin-info" style="text-align: right;">
                    <h4>{{ current_user.name }}</h4>
                    <p>Administrator</p>
                </div>
                <div class="admin-avatar">
                    <i class="fas fa-user-shield"></i>
                </div>
            </div>
        </header>

        <div class="content-wrapper">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('sidebarOverlay').classList.toggle('show');
            
            // Prevent body scrolling when menu is open
            if(document.getElementById('sidebar').classList.contains('show')) {
                document.body.style.overflow = 'hidden';
            } else {
                document.body.style.overflow = 'auto';
            }
        }
    </script>
</body>
</html>
