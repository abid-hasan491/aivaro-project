{% extends 'base.html' %}
{% block content %}
<style>
    .auth-wrapper { min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
    .auth-card { background: var(--panel-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 50px 40px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.4); animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); text-align: center; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    
    .auth-icon { font-size: 40px; color: var(--accent-color); margin-bottom: 20px; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    
    .auth-title { font-family: var(--font-head); font-size: 28px; color: var(--text-color); margin-bottom: 10px; }
    .auth-subtitle { font-size: 12px; color: var(--muted-color); line-height: 1.5; margin-bottom: 30px; }
    
    .input-group { position: relative; margin-bottom: 25px; text-align: left; }
    .auth-input { width: 100%; background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 16px 15px; border-radius: 8px; font-size: 13px; outline: none; transition: 0.3s; }
    .auth-input:focus { border-color: var(--accent-color); box-shadow: 0 0 15px rgba(198, 167, 94, 0.1); }
    .input-label { position: absolute; top: -10px; left: 15px; background: var(--panel-color); padding: 0 5px; font-size: 10px; color: var(--accent-color); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    
    .auth-btn { width: 100%; background: var(--accent-color); color: #000; padding: 16px; border: none; border-radius: 30px; font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.4s; }
    .auth-btn:hover { background: var(--text-color); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
    .back-link { display: inline-block; margin-top: 20px; font-size: 11px; color: var(--muted-color); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
    .back-link:hover { color: var(--accent-color); }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <i class="fas fa-lock auth-icon"></i>
        <h2 class="auth-title">Recover Password</h2>
        <p class="auth-subtitle">Enter your registered email address. We will send you a 4-digit code to reset your password.</p>
        
        <form method="POST">
            <div class="input-group">
                <label class="input-label">Email Address</label>
                <input type="email" name="email" class="auth-input" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="auth-btn">Send Reset Code</button>
        </form>
        
        <a href="/login" class="back-link"><i class="fas fa-arrow-left"></i> Back to Login</a>
    </div>
</div>
{% endblock %}
